<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campus AI - Student Inbox</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#07111f;
    color:white;
    min-height:100vh;
}

.header{
    height:70px;
    background:#0c192b;
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;
    object-fit:contain;
    background:white;
    border-radius:9px;
    padding:4px;
}

.brand{
    font-size:21px;
    font-weight:800;
}

.brand span{
    color:#4da3ff;
}

.back{
    background:#17283e;
    color:white;
    border:1px solid rgba(255,255,255,.1);
    padding:10px 16px;
    border-radius:9px;
    cursor:pointer;
}

.main{
    max-width:1100px;
    margin:auto;
    padding:35px 20px;
}

.title h1{
    font-size:32px;
}

.title p{
    color:#8296ad;
    margin-top:7px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:20px;
    margin-top:28px;
}

.panel{
    background:#0d1b2d;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:23px;
}

.panel h2{
    font-size:20px;
    margin-bottom:18px;
}

input,
select,
textarea{
    width:100%;
    background:#102238;
    color:white;
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    padding:13px;
    outline:none;
    margin-bottom:13px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#438ee8;
}

.send{
    width:100%;
    background:#287bd9;
    color:white;
    border:0;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.send:hover{
    background:#3990ed;
}

.message{
    background:#102238;
    border:1px solid rgba(255,255,255,.06);
    border-radius:13px;
    padding:16px;
    margin-bottom:12px;
}

.message-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
}

.message h3{
    font-size:15px;
}

.status{
    font-size:11px;
    padding:5px 9px;
    border-radius:20px;
    background:#193c2c;
    color:#6ee7a1;
}

.status.pending{
    background:#40351a;
    color:#ffd66b;
}

.message p{
    color:#91a4bb;
    font-size:14px;
    line-height:1.5;
}

.message small{
    display:block;
    color:#5f738a;
    margin-top:10px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#71869e;
    background:#102238;
    border-radius:12px;
}

.clear{
    margin-top:12px;
    background:#17283e;
    color:#ff8791;
    border:0;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
}

@media(max-width:800px){

    .layout{
        grid-template-columns:1fr;
    }

    .header{
        padding:0 15px;
    }

    .main{
        padding:25px 15px;
    }

    .brand{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo-area">
        <img src="assets/alpha-logo.jpeg" class="logo">

        <div class="brand">
            CAMPUS <span>AI</span>
        </div>
    </div>

    <button class="back"
            onclick="location.href='dashboard.html'">
        ← Dashboard
    </button>

</header>


<main class="main">

    <div class="title">
        <h1>Student Inbox 📥</h1>
        <p>Send your questions, complaints and requests.</p>
    </div>


    <section class="layout">

        <!-- SEND MESSAGE -->

        <div class="panel">

            <h2>✉️ New Message</h2>

            <input
                type="text"
                id="subject"
                placeholder="Subject"
            >

            <select id="category">

                <option value="">
                    Select category
                </option>

                <option value="Academic">
                    Academic
                </option>

                <option value="Examination">
                    Examination
                </option>

                <option value="Fees">
                    Fees
                </option>

                <option value="College Event">
                    College Event
                </option>

                <option value="Technical Support">
                    Technical Support
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <textarea
                id="message"
                placeholder="Write your message..."
            ></textarea>

            <button class="send"
                    onclick="sendMessage()">
                Send Message
            </button>

        </div>


        <!-- MESSAGES -->

        <div class="panel">

            <h2>📨 My Messages</h2>

            <div id="messageList"></div>

            <button class="clear"
                    onclick="clearMessages()">
                Clear Demo Messages
            </button>

        </div>

    </section>

</main>


<script>

let messages =
    JSON.parse(localStorage.getItem("campusMessages")) || [];


function sendMessage(){

    const subject =
        document.getElementById("subject").value.trim();

    const category =
        document.getElementById("category").value;

    const message =
        document.getElementById("message").value.trim();


    if(!subject || !category || !message){

        alert("Please fill all the fields.");

        return;
    }


    const newMessage = {

        id:Date.now(),

        subject:subject,

        category:category,

        message:message,

        status:"Pending",

        date:new Date().toLocaleString()

    };


    messages.unshift(newMessage);


    localStorage.setItem(
        "campusMessages",
        JSON.stringify(messages)
    );


    document.getElementById("subject").value = "";

    document.getElementById("category").value = "";

    document.getElementById("message").value = "";


    displayMessages();


    alert("Your message has been submitted successfully!");


}


function displayMessages(){

    const list =
        document.getElementById("messageList");


    list.innerHTML = "";


    if(messages.length === 0){

        list.innerHTML = `
            <div class="empty">
                📭 No messages yet.
            </div>
        `;

        return;
    }


    messages.forEach(item => {

        const div =
            document.createElement("div");


        div.className = "message";


        const statusClass =
            item.status === "Pending"
            ? "status pending"
            : "status";


        div.innerHTML = `

            <div class="message-top">

                <h3>${escapeHTML(item.subject)}</h3>

                <span class="${statusClass}">
                    ${escapeHTML(item.status)}
                </span>

            </div>

            <p>
                <strong>${escapeHTML(item.category)}</strong>
                <br><br>
                ${escapeHTML(item.message)}
            </p>

            <small>
                ${escapeHTML(item.date)}
            </small>

        `;


        list.appendChild(div);

    });

}


function clearMessages(){

    if(messages.length === 0){

        return;
    }


    if(confirm("Clear all demo messages?")){

        messages = [];

        localStorage.removeItem("campusMessages");

        displayMessages();

    }

}


function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


displayMessages();

</script>

</body>
</html>
