<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus AI - Smart Notes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#07111f;
    color:white;
    min-height:100vh;
}

.header{
    height:70px;
    background:#0c192b;
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;
    object-fit:contain;
    background:white;
    border-radius:9px;
    padding:4px;
}

.brand{
    font-size:21px;
    font-weight:800;
}

.brand span{
    color:#4da3ff;
}

.back{
    background:#17283e;
    color:white;
    border:1px solid rgba(255,255,255,.1);
    padding:10px 16px;
    border-radius:9px;
    cursor:pointer;
}

.main{
    max-width:1200px;
    margin:auto;
    padding:35px;
}

.title{
    margin-bottom:25px;
}

.title h1{
    font-size:32px;
}

.title p{
    color:#8296ad;
    margin-top:7px;
}

.create{
    background:#0d1b2d;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px;
    margin-bottom:30px;
}

input,
textarea{
    width:100%;
    background:#102238;
    border:1px solid rgba(255,255,255,.08);
    color:white;
    border-radius:10px;
    padding:13px;
    outline:none;
    margin-bottom:12px;
}

input:focus,
textarea:focus{
    border-color:#438ee8;
}

textarea{
    min-height:130px;
    resize:vertical;
}

button{
    cursor:pointer;
}

.save{
    background:#287bd9;
    border:0;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
}

.save:hover{
    background:#3990ed;
}

.notes-title{
    font-size:22px;
    margin-bottom:15px;
}

.notes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.note-card{
    background:linear-gradient(145deg,#102238,#0b1829);
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    padding:20px;
    min-height:180px;
}

.note-card h3{
    margin-bottom:10px;
}

.note-card p{
    color:#91a4bb;
    line-height:1.5;
    font-size:14px;
    white-space:pre-wrap;
}

.note-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.delete{
    background:#17283e;
    color:#ff8791;
    border:0;
    padding:8px 12px;
    border-radius:8px;
}

.empty{
    color:#687d94;
    padding:30px;
    text-align:center;
    background:#0d1b2d;
    border-radius:15px;
}

@media(max-width:850px){
    .notes{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .main{
        padding:22px 15px;
    }

    .notes{
        grid-template-columns:1fr;
    }

    .header{
        padding:0 15px;
    }

    .brand{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo-area">
        <img src="assets/alpha-logo.jpeg" class="logo">
        <div class="brand">CAMPUS <span>AI</span></div>
    </div>

    <button class="back" onclick="location.href='dashboard.html'">
        ← Dashboard
    </button>

</header>


<main class="main">

    <div class="title">
        <h1>Smart Notes 📝</h1>
        <p>Create and save your study notes in Campus AI.</p>
    </div>


    <section class="create">

        <input
            type="text"
            id="noteTitle"
            placeholder="Enter note title..."
        >

        <textarea
            id="noteContent"
            placeholder="Write your notes here..."
        ></textarea>

        <button class="save" onclick="saveNote()">
            + Save Note
        </button>

    </section>


    <h2 class="notes-title">My Notes</h2>

    <section class="notes" id="notesContainer"></section>

</main>


<script>

let notes = JSON.parse(localStorage.getItem("campusNotes")) || [];


function saveNote(){

    const title =
        document.getElementById("noteTitle").value.trim();

    const content =
        document.getElementById("noteContent").value.trim();

    if(!title || !content){

        alert("Please enter both title and note.");

        return;
    }

    const note = {
        id: Date.now(),
        title: title,
        content: content
    };

    notes.unshift(note);

    localStorage.setItem(
        "campusNotes",
        JSON.stringify(notes)
    );

    document.getElementById("noteTitle").value = "";
    document.getElementById("noteContent").value = "";

    displayNotes();
}


function deleteNote(id){

    notes = notes.filter(note => note.id !== id);

    localStorage.setItem(
        "campusNotes",
        JSON.stringify(notes)
    );

    displayNotes();
}


function displayNotes(){

    const container =
        document.getElementById("notesContainer");

    container.innerHTML = "";

    if(notes.length === 0){

        container.innerHTML = `
            <div class="empty">
                📚 No notes yet.<br>
                Create your first study note above.
            </div>
        `;

        return;
    }

    notes.forEach(note => {

        const card = document.createElement("div");

        card.className = "note-card";

        card.innerHTML = `
            <h3>${escapeHTML(note.title)}</h3>

            <p>${escapeHTML(note.content)}</p>

            <div class="note-actions">
                <button
                    class="delete"
                    onclick="deleteNote(${note.id})">
                    Delete
                </button>
            </div>
        `;

        container.appendChild(card);

    });
}


function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


displayNotes();

</script>

</body>
</html>
